<title>Maths Worlds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Lexend:wght@400;600&display=swap">
<style>
/* Layout: one screen. A dusk world fills the stage; a small row of floating islands picks the world; goggles reveal the numbers. One committed dark visual world, so colours are set once. */
:root{
  color-scheme:dark;
  --sky1:#1d1840; --sky2:#3a2861; --sky3:#7d4775; --sky4:#e08a76;
  --ink:#fff4e6; --ink-soft:#d8c6e4; --glass:rgba(255,244,230,.09); --glass-2:rgba(255,244,230,.17); --line:rgba(255,244,230,.22);
  --amber:#ffc04d; --teal:#6fe3cd; --gold:#fff0a0; --warn:#ff7a93; --deep:#251d4a;
  --font-display:"Fraunces",Georgia,"Times New Roman",serif;
  --font-body:"Lexend","Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--sky1);background-image:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 40%,var(--sky3) 74%,var(--sky4) 100%);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:10px 8px;display:flex;flex-direction:column;overflow:hidden}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:nowrap;position:relative;z-index:5}
.worlds{display:flex;gap:4px;flex-wrap:nowrap;position:relative;min-width:0;overflow-x:auto;scrollbar-width:none;padding-block:2px}
.worlds::-webkit-scrollbar{display:none}
.menuwrap{position:relative;flex:0 0 auto}
.badge{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--gold);color:var(--sky2);font-size:11px;font-weight:600;line-height:18px;text-align:center}
.worlds::before{content:'';position:absolute;left:34px;right:34px;top:27px;border-top:2px dotted rgba(255,240,160,.4);z-index:0}
.isle{position:relative;z-index:1}
.isle.done::after{content:'';position:absolute;top:2px;right:8px;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,var(--gold) 45%,var(--amber));box-shadow:0 0 8px var(--gold)}
.isle{display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;color:var(--ink-soft);padding:4px 6px;border-radius:14px;cursor:pointer;font-size:.8rem;min-width:62px}
.isle svg{width:46px;height:46px;border-radius:50%;background:#2c2356;transition:box-shadow .25s,background .25s}
.isle[aria-current="true"]{color:var(--ink)}
.isle[aria-current="true"] svg{background:#3b2f6e;box-shadow:0 0 0 2px var(--gold),0 0 20px rgba(255,240,160,.35)}
.tools{position:absolute;right:0;top:56px;display:flex;flex-direction:column;gap:10px;padding:10px;border-radius:30px;background:var(--deep);box-shadow:0 0 0 1px var(--line),0 18px 40px rgba(0,0,0,.45);z-index:15}
.tools[hidden]{display:none}
#menuBtn{position:relative}
#menuBtn[aria-expanded="true"]{background:var(--glass-2)}
.tool{width:48px;height:48px;border-radius:50%;border:0;background:var(--glass);display:grid;place-items:center;cursor:pointer;padding:0}
.tool svg{width:26px;height:26px}
.tool[aria-pressed="true"]{background:var(--gold);color:var(--sky2)}
.tool:hover{background:var(--glass-2)}
.tool[aria-pressed="true"]:hover{background:var(--gold)}

.prompt{margin:4px auto 2px;height:4.05em;flex:0 0 auto;overflow:hidden;max-width:46ch;padding-inline:8px;text-align:center;font-family:var(--font-display);font-style:italic;font-weight:500;font-size:1.2rem;line-height:1.35;display:flex;align-items:center;justify-content:center;transition:opacity .25s}
.stagewrap{position:relative;flex:1;min-height:0;margin-bottom:6px}
.stagewrap.dockpad{padding-bottom:64px}
#dock{position:absolute;right:10px;bottom:0;height:64px;width:auto;aspect-ratio:230/70;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.nudgey{animation:nudgey 1.1s ease-in-out infinite}.nudgeup{animation:nudgeup 1.1s ease-in-out infinite}@keyframes nudgeup{50%{transform:translateY(-9px)}}.nudger{animation:nudger 1.1s ease-in-out infinite}@keyframes nudger{50%{transform:translateX(9px)}}@keyframes nudgey{50%{transform:translateY(9px)}}
#stage{width:100%;height:100%;display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#stage text{font-family:var(--font-body)}

.hit{cursor:grab;outline:none}
.hit:active{cursor:grabbing}
.hit.pressed{filter:brightness(1.18) drop-shadow(0 0 6px rgba(255,240,160,.55))}
.glint{animation:glint 3.6s ease-in-out infinite}
@keyframes glint{0%,60%{transform:translateX(-80px)}85%,100%{transform:translateX(380px)}}
.bob{animation:breathe 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes breathe{50%{transform:scale(1.04,.96)}}
.lid{transform-box:fill-box;transform-origin:center;transform:scaleY(0);animation:blink 5.5s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(0)}95.5%{transform:scaleY(1)}}
.dizzy{animation:dizzy .5s ease-in-out 3;transform-box:fill-box;transform-origin:50% 100%}
@keyframes dizzy{25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
.dotch{fill:#f0960c!important;font-weight:900;stroke:#ffd27a;stroke-width:.6px}
.dotless .dotch{fill:#6a6088!important;stroke:none}.dotless .dotsp circle{fill:#4a4268!important;stroke:#6a6088!important}.dotless .dotsp circle:first-child{opacity:0}
.num{opacity:0;transition:opacity .35s;pointer-events:none}
.goggles .num{opacity:1}
.num text{fill:var(--ink);font-weight:600}
.ring{animation:ring 1.1s ease-in-out infinite alternate;pointer-events:none}
@keyframes ring{0%{opacity:.95}100%{opacity:.2}}
.mote{animation:drift 13s ease-in-out infinite alternate}
.nudge{animation:nudge 1.1s ease-in-out infinite}@keyframes nudge{50%{transform:translateX(-9px)}}
@keyframes drift{to{transform:translate(20px,-28px)}}
.twinkle{animation:tw 4s ease-in-out infinite alternate}
@keyframes tw{to{opacity:.25}}
.locked{opacity:.3;pointer-events:none}

.sheet{position:fixed;left:0;right:0;bottom:0;max-height:80%;overflow:auto;background:var(--deep);border-radius:22px 22px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));box-shadow:0 -20px 50px rgba(0,0,0,.45);z-index:10}
.sheet[hidden]{display:none}
.sheet .in{max-width:620px;margin-inline:auto}
.sheet h2{font-family:var(--font-display);font-weight:600;font-size:1.4rem;margin:0 0 10px;text-wrap:balance}
.sheet h3{font-size:1rem;margin:18px 0 4px}
.sheet p{max-width:60ch;line-height:1.6;color:var(--ink-soft);margin:.5em 0}
.sheet .x{float:right;margin:-4px -4px 0 8px}
.idea{display:grid;grid-template-columns:18px 1fr;gap:12px;margin:12px 0;color:var(--ink-soft)}
.idea.on{color:var(--ink)}
.seed{width:16px;height:16px;border-radius:50%;margin-top:3px;background:var(--glass-2)}
.idea.on .seed{background:radial-gradient(circle at 35% 35%,#fff,var(--gold) 45%,var(--amber));box-shadow:0 0 12px var(--gold)}
.who{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 4px}
.chip{min-height:40px;padding:0 16px;border-radius:999px;border:0;background:var(--glass);cursor:pointer;font-weight:600}
.chip[aria-pressed="true"]{background:var(--gold);color:var(--sky2)}
#toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:420px;margin-inline:auto;background:var(--gold);color:var(--sky2);padding:12px 16px;border-radius:16px;font-weight:600;text-align:center;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#toast[hidden]{display:none}
@media (max-width:480px){.isle{min-width:48px;font-size:.68rem;padding-inline:2px}.isle svg{width:38px;height:38px}.tool{width:44px;height:44px}.tools{top:50px}.prompt{font-size:1rem;margin-block:4px 2px}}
.flicker{animation:flick 2.6s ease-in-out infinite alternate}
@keyframes flick{0%{opacity:.55}40%{opacity:.85}70%{opacity:.6}100%{opacity:.95}}
@media (prefers-reduced-motion:reduce){.isle.fresh svg,.ccard,.bob,.lid,.mote,.nudge,.nudgey,.nudgeup,.nudger,.ring,.twinkle,.dizzy,.flicker,.glint{animation:none}}

/* hub, players, locks */
body.inhub .worlds,body.athub #homeBtn{visibility:hidden}
#homeBtn{flex:0 0 auto}
.isle.lock{cursor:not-allowed}
.isle.lock svg{filter:grayscale(1) brightness(.45)}
.isle.lock::before{content:'';position:absolute;top:22px;left:50%;width:16px;height:13px;margin-left:-8px;border-radius:3px;background:#c9b8ee;z-index:2;box-shadow:0 0 0 2px #2c2356}
.isle.lock::after{content:'';position:absolute;top:13px;left:50%;width:9px;height:10px;margin-left:-6.5px;border:2.5px solid #c9b8ee;border-bottom:0;border-radius:6px 6px 0 0;z-index:2}
.isle.fresh svg{animation:fresh 1.6s ease-in-out infinite}
@keyframes fresh{50%{box-shadow:0 0 0 3px var(--gold),0 0 26px rgba(255,240,160,.7)}}
.scr{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 45%,var(--sky3) 80%,var(--sky4) 100%);overflow:auto}
.scr[hidden]{display:none}
.scr.dim{background:rgba(18,12,42,.72);backdrop-filter:blur(3px)}
.scr-in{text-align:center;max-width:640px;width:100%}
.scr h2{font-family:var(--font-display);font-style:italic;font-weight:500;font-size:clamp(1.8rem,6vw,2.8rem);margin:0 0 22px}
.cards{display:flex;flex-wrap:wrap;justify-content:center;gap:16px}
.pcard{display:flex;flex-direction:column;align-items:center;gap:6px;width:132px;padding:14px 8px 12px;border:0;border-radius:22px;background:var(--glass);cursor:pointer;font-weight:600;font-size:1.05rem;transition:background .2s,transform .2s}
.pcard:hover,.pcard:focus-visible{background:var(--glass-2);transform:translateY(-3px)}
.pcard .av{width:96px;height:96px;overflow:visible}
.pcard.grown{color:var(--ink-soft);font-size:.92rem}
.hint{color:var(--ink-soft);margin-top:18px}
.pindots{display:flex;gap:16px;justify-content:center;margin:0 0 22px}
.pindots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--gold);display:block}
.pindots i.on{background:var(--gold)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px;justify-content:center}
.key{width:72px;height:72px;border-radius:50%;border:0;background:var(--glass);font-size:1.6rem;font-weight:600;cursor:pointer}
.key:active{background:var(--glass-2)}
.ccard{background:var(--deep);border-radius:26px;padding:26px 24px 22px;max-width:380px;width:100%;text-align:center;box-shadow:0 0 0 1px var(--line),0 24px 60px rgba(0,0,0,.5);animation:pop .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.ccard h2{font-family:var(--font-display);font-style:italic;font-weight:500;font-size:1.7rem;margin:6px 0 6px}
.ccard p{color:var(--ink-soft);margin:0 0 18px}
#ccIcon svg{width:84px;height:84px;border-radius:50%;background:#3b2f6e;box-shadow:0 0 0 3px var(--gold),0 0 34px rgba(255,240,160,.55)}
.crow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.chip.gold{background:var(--gold);color:var(--sky2)}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 10px;border-radius:14px;background:var(--glass)}
.prow b{min-width:5ch}.pmeta{flex:1;color:var(--ink-soft);font-size:.88rem}
.pdot{width:18px;height:18px;border-radius:50%;flex:0 0 auto}
.addp{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.addp input{font:inherit;color:var(--ink);background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:220px}
.cols{display:flex;gap:8px;flex-wrap:wrap}
.cdot{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.cdot[aria-pressed="true"]{border-color:var(--ink)}
</style>

<h1 class="vh">Maths Worlds</h1>
<div class="top">
  <button class="tool" id="homeBtn" aria-label="Back to the sky" title="Home"><svg viewBox="0 0 26 26" aria-hidden="true"><path d="M4 12.5 13 5l9 7.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 11v9.5h4.5v-5h3v5H19V11" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
  <nav class="worlds" aria-label="Worlds">
    <button class="isle" data-w="share" aria-current="true"><svg viewBox="0 0 42 42" aria-hidden="true"><rect x="7" y="22" width="28" height="9" rx="4" fill="#ffc04d"/><path d="M16 22v9M26 22v9" stroke="#3a2861" stroke-width="1.6"/><circle cx="12" cy="17" r="4.5" fill="#ff8f7a"/><circle cx="21" cy="16" r="4.5" fill="#b8a2ff"/><circle cx="30" cy="17" r="4.5" fill="#8ff0c8"/></svg>Share</button>
    <button class="isle" data-w="scales" aria-current="false"><svg viewBox="0 0 42 42" aria-hidden="true"><path d="M21 13v19M14 32h14" stroke="#d8c6e4" stroke-width="2" stroke-linecap="round"/><path d="M8 17l26-5" stroke="#fff0a0" stroke-width="2.4" stroke-linecap="round"/><rect x="4" y="23" width="10" height="4" rx="2" fill="#ffc04d"/><rect x="28" y="18" width="10" height="4" rx="2" fill="#6fe3cd"/></svg>Scales</button>
    <button class="isle" data-w="match" aria-current="false"><svg viewBox="0 0 42 42" aria-hidden="true"><circle cx="14" cy="21" r="9" fill="#5b3b78"/><path d="M14 21V12A9 9 0 0 1 14 30Z" fill="#ffb34d"/><circle cx="29" cy="21" r="9" fill="#5b3b78"/><path d="M29 21V12A9 9 0 0 1 38 21Z M29 21H38A9 9 0 0 1 29 30Z" fill="#ffb34d" stroke="#5b3b78" stroke-width=".8"/></svg>Match</button>
    <button class="isle" data-w="glue" aria-current="false"><svg viewBox="0 0 42 42" aria-hidden="true"><path d="M9 36V16Q9 6 21 5Q33 6 33 16V36Z" fill="#1d1830" stroke="#6b5f84" stroke-width="2"/><rect x="11" y="16" width="10" height="9" fill="#e8435a"/><rect x="11" y="26" width="10" height="9" fill="#3f7fe0"/><rect x="22" y="16" width="9" height="9" fill="#dfe9f5" opacity=".5"/><rect x="22" y="26" width="9" height="9" fill="#dfe9f5" opacity=".5"/><circle cx="21" cy="11" r="3.5" fill="#e9f2ff"/></svg>Glass</button>
    <button class="isle" data-w="join" aria-current="false"><svg viewBox="0 0 42 42" aria-hidden="true"><path d="M12 15V7A8 8 0 0 1 20 15Z" fill="#ffb34d"/><path d="M22 15V7A8 8 0 0 1 28.9 11Z" fill="#8fd47a"/><path d="M8 24h10M13 19v10" stroke="#fff0a0" stroke-width="2" stroke-linecap="round"/><circle cx="29" cy="28" r="8" fill="#5b3b78"/><path d="M29 28V20A8 8 0 0 1 35.9 32Z" fill="#ffb34d"/></svg>Join</button>
    <button class="isle" data-w="hive" aria-current="false"><svg viewBox="0 0 42 42" aria-hidden="true"><g stroke="#c98a3a" stroke-width="1.5"><path d="M11 9l5 3v6l-5 3-5-3v-6z" fill="#f2a93a"/><path d="M21 9l5 3v6l-5 3-5-3v-6z" fill="#f2a93a"/><path d="M16 18l5 3v6l-5 3-5-3v-6z" fill="#f2a93a"/><path d="M26 18l5 3v6l-5 3-5-3v-6z" fill="#4a3222"/></g><ellipse cx="32" cy="10" rx="4.5" ry="3.4" fill="#ffd34d"/><path d="M30.5 7v6M33 7v6" stroke="#2a1a12" stroke-width="1.2"/><ellipse cx="31" cy="6" rx="2.5" ry="2" fill="#e8f4ff" opacity=".8"/></svg>Hive</button>
    <button class="isle" data-w="jugs" aria-current="false"><svg viewBox="0 0 42 42" aria-hidden="true"><rect x="6" y="12" width="13" height="20" rx="3" fill="none" stroke="#d8c6e4" stroke-width="1.6"/><rect x="7.5" y="13.5" width="10" height="17" rx="2" fill="#7fd6ff"/><rect x="23" y="12" width="13" height="20" rx="3" fill="none" stroke="#d8c6e4" stroke-width="1.6"/><rect x="24.5" y="22" width="10" height="8.5" rx="2" fill="#7fd6ff"/></svg>Jugs</button>
    <button class="isle" data-w="take" aria-current="false"><svg viewBox="0 0 42 42" aria-hidden="true"><path d="M7 14h28v14H7z" fill="#7a4a2e"/><path d="M14 14v14M21 14v14M28 14v14M7 21h28" stroke="#4a2a18" stroke-width="1.4"/><path d="M28 14h7v7c-2.5 0-3-1.5-4.5-1.5S28 21 28 21z" fill="#3a2861"/><circle cx="32" cy="12" r="1.4" fill="#d8c6e4"/><circle cx="35" cy="16" r="1" fill="#d8c6e4"/></svg>Take</button>
    <button class="isle" data-w="smash" aria-current="false"><svg viewBox="0 0 42 42" aria-hidden="true"><g fill="#8fd6ff"><rect x="8" y="12" width="7" height="7" rx="1.5"/><rect x="17" y="12" width="7" height="7" rx="1.5"/><rect x="8" y="21" width="7" height="7" rx="1.5"/><rect x="17" y="21" width="7" height="7" rx="1.5" opacity=".25"/><rect x="26" y="21" width="7" height="7" rx="1.5" opacity=".25"/></g><rect x="26" y="12" width="7" height="7" rx="1.5" fill="#ffb3d9"/><path d="M24 31l3-3M29 33l1-4M20 32l-1-3" stroke="#fff0a0" stroke-width="1.6" stroke-linecap="round"/></svg>Smash</button>
    <button class="isle" data-w="leap" aria-current="false"><svg viewBox="0 0 42 42" aria-hidden="true"><path d="M4 32h34" stroke="#5aa0e0" stroke-width="2.5" stroke-linecap="round"/><path d="M9 30 Q16 8 24 30 Q30 16 36 30" fill="none" stroke="#fff0a0" stroke-width="1.6" stroke-dasharray="2.5 2.5"/><ellipse cx="9" cy="27" rx="6" ry="4" fill="#7fd36b"/><circle cx="7" cy="23.5" r="2" fill="#7fd36b"/><circle cx="11" cy="23.5" r="2" fill="#7fd36b"/><circle cx="7" cy="23.3" r="1" fill="#241a3a"/><circle cx="11" cy="23.3" r="1" fill="#241a3a"/><ellipse cx="24" cy="31" rx="4" ry="1.6" fill="#3f9b4f"/></svg>Leap</button>
    <button class="isle" data-w="toll" aria-current="false"><svg viewBox="0 0 42 42" aria-hidden="true"><path d="M4 26 Q21 33 38 26" fill="none" stroke="#c9a77a" stroke-width="2.4"/><path d="M8 27v4M14 29v4M20 30v4M26 29v4M32 27v4" stroke="#9c7350" stroke-width="2"/><path d="M27 24 C25 14 29 8 33 8 C37 8 41 14 39 24Z" fill="#7f9b6e"/><circle cx="31" cy="14" r="1.6" fill="#241a3a"/><circle cx="36" cy="14" r="1.6" fill="#241a3a"/><path d="M30 8l-2-4M36 8l2-4" stroke="#e8dcc0" stroke-width="1.8" stroke-linecap="round"/><path d="M9 14l4 -4 4 4 -4 5z" fill="#ff7eb6"/><path d="M15 19l3 -3 3 3 -3 4z" fill="#7ee0ff"/></svg>Toll</button>
    <button class="isle" data-w="fold" aria-current="false"><svg viewBox="0 0 42 42" aria-hidden="true"><path d="M8 8h26v26H8z" fill="#fdf6ea"/><path d="M8 8h13v26H8z" fill="#5aa8ff"/><path d="M8 8h13v9H8z" fill="#9a6cff"/><path d="M21 8v26M8 17h26M8 26h26" stroke="#b9a98e" stroke-width="1.2" stroke-dasharray="2 2"/><path d="M34 34l-9 0 9-9z" fill="#e9dfd0" stroke="#fff0a0" stroke-width="1.2"/></svg>Fold</button>
